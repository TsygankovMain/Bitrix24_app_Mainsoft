<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отражение часов (Beta)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="//api.bitrix24.com/api/v1/"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* slate-50 */
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            user-select: none;
        }

        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }

        /* Custom Scrollbar for Webkit */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body>
    <div id="root" class="h-screen flex flex-col overflow-hidden"></div>

    <script type="text/babel">
        // --- ЗАВИСИМОСТИ ICONS ---
        const Icon = ({ name, className = "", filled = false }) => (
            <span className={`material-symbols-outlined ${filled ? 'filled' : ''} ${className}`}>{name}</span>
        );

        // --- КОНФИГУРАЦИЯ (ВРЕМЕННЫЕ ЗАГЛУШКИ, БУДУТ ПЕРЕЗАПИСАНЫ) ---
        // Эти значения будут перезаписаны из app.option.get
        const BACKEND_MAPPING = {
            'id_zadachi': 'TASK_ID',
            'sotrudnik': 'EMPLOYEE',
            'kolichestvo_chasov': 'HOURS',
            'uchitivaem': 'IS_CONSIDERED',
            'opisanie': 'DESCRIPTION',
            'id_zadach_ierarhiya': 'TASK_HIERARCHY',
            'title_zadach_ierarhiya': 'TITLE_HIERARCHY'
        };

        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // --- HOOKS ---

        // Hook авторизации, получения данных о пользователе и КОНФИГУРАЦИИ
        const useBitrixInit = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [usersMap, setUsersMap] = useState({});
            const [config, setConfig] = useState(null);
            const [isReady, setIsReady] = useState(false);
            const [initError, setInitError] = useState(null);

            useEffect(() => {
                BX24.init(() => {
                    BX24.callBatch({
                        currentUser: ['user.current', {}],
                        allUsers: ['user.get', { FILTER: { 'ACTIVE': 'Y' }, 'sort': 'LAST_NAME', 'order': 'ASC' }],
                        appParam: ['app.option.get', {}]
                    }, res => {
                        // 1. Users
                        if (res.currentUser && !res.currentUser.error()) {
                            setCurrentUser(res.currentUser.data());
                        }
                        if (res.allUsers && !res.allUsers.error()) {
                            const map = {};
                            res.allUsers.data().forEach(u => map[u.ID] = u);
                            setUsersMap(map);
                        }

                        // 2. Configuration
                        if (res.appParam && !res.appParam.error()) {
                            try {
                                const result = res.appParam.data();
                                if (result && result.timestamp_config) {
                                    const rawConfig = JSON.parse(result.timestamp_config);

                                    // Transform backend mapping key -> frontend constant key
                                    // Backend: {'id_zadachi': 'ufCrm...', 'kolichestvo_chasov': 'ufCrm...'}
                                    // Target: FIELDS: { TASK_ID: 'ufCrm...', HOURS: 'ufCrm...' }

                                    const spId = rawConfig.sp_entity_type_id;
                                    const backendFields = rawConfig.fields_mapping || {};

                                    const fields = {};
                                    Object.entries(BACKEND_MAPPING).forEach(([backendKey, frontendKey]) => {
                                        if (backendFields[backendKey]) {
                                            fields[frontendKey] = backendFields[backendKey];
                                        }
                                    });

                                    // Check critical fields
                                    if (!spId || !fields.TASK_ID || !fields.HOURS) {
                                        throw new Error("Неполная конфигурация: отсутствуют обязательные поля или ID Смарт-процесса.");
                                    }

                                    setConfig({
                                        DEFAULT_SMART_PROCESS_ID: spId,
                                        FIELDS: fields
                                    });

                                } else {
                                    throw new Error("Конфигурация приложения не найдена (app.option пуст). Запустите установщик.");
                                }
                            } catch (e) {
                                console.error("Config Error:", e);
                                setInitError(e.message);
                            }
                        } else {
                            if (res.appParam && res.appParam.error()) {
                                setInitError("Ошибка получения настроек: " + res.appParam.error());
                            } else {
                                setInitError("Не удалось получить настройки приложения.");
                            }
                        }

                        setIsReady(true);
                    });
                });
            }, []);

            return { currentUser, usersMap, config, isReady, initError };
        };

        // UI КОМПОНЕНТЫ

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, icon = null, loading = false }) => {
            const baseClass = "px-4 py-2 rounded-lg font-medium transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700 shadow-sm hover:shadow",
                secondary: "bg-white text-slate-700 border border-slate-300 hover:bg-slate-50",
                danger: "bg-red-50 text-red-600 border border-red-200 hover:bg-red-100",
                success: "bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm",
                ghost: "text-slate-500 hover:bg-slate-100 px-2 py-1"
            };

            return (
                <button onClick={onClick} disabled={disabled || loading} className={`${baseClass} ${variants[variant]} ${className}`}>
                    {loading && <Icon name="progress_activity" className="animate-spin text-lg" />}
                    {!loading && icon && <Icon name={icon} className="text-lg" />}
                    {children}
                </button>
            );
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl border border-slate-200 shadow-sm ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ children, color = "slate" }) => {
            const colors = {
                slate: "bg-slate-100 text-slate-600",
                green: "bg-emerald-50 text-emerald-700 border border-emerald-100",
                red: "bg-rose-50 text-rose-700 border border-rose-100",
                blue: "bg-blue-50 text-blue-700 border border-blue-100",
                yellow: "bg-amber-50 text-amber-700 border border-amber-100",
            };
            return <span className={`px-2 py-0.5 rounded text-xs font-medium ${colors[color]}`}>{children}</span>;
        };

        const StatItem = ({ label, value, subtext, icon, color = "text-slate-600" }) => (
            <div className="flex items-center gap-3 p-3 bg-white border border-slate-100 rounded-xl shadow-sm">
                <div className={`p-2 rounded-lg bg-opacity-10 ${color.replace('text-', 'bg-')}`}>
                    <Icon name={icon} className={`text-2xl ${color}`} />
                </div>
                <div>
                    <p className="text-xs text-slate-500 font-medium uppercase tracking-wide">{label}</p>
                    <p className="text-xl font-bold text-slate-900">{value}</p>
                    {subtext && <p className="text-xs text-slate-400">{subtext}</p>}
                </div>
            </div>
        );

        const Modal = ({ title, children, onClose, footer }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fade-in">
                <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col max-h-[90vh]">
                    <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                        <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-200 transition-colors text-slate-400 hover:text-slate-600">
                            <Icon name="close" />
                        </button>
                    </div>
                    <div className="p-6 overflow-y-auto custom-scrollbar">
                        {children}
                    </div>
                    {footer && (
                        <div className="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                            {footer}
                        </div>
                    )}
                </div>
            </div>
        );

        // --- МОДАЛКА РЕДАКТИРОВАНИЯ ---
        const EditItemModal = ({ item, usersMap, onClose, onSave }) => {
            const [hours, setHours] = useState(item.hours);
            const [isConsidered, setIsConsidered] = useState(item.isConsidered);
            const [description, setDescription] = useState(item.description);
            const [employeeId, setEmployeeId] = useState(item.employeeId);
            const [isSaving, setIsSaving] = useState(false);

            const handleSave = async () => {
                setIsSaving(true);
                await onSave({
                    id: item.id,
                    hours: parseFloat(hours) || 0,
                    isConsidered,
                    description,
                    employeeId
                });
                setIsSaving(false);
                onClose();
            };

            return (
                <Modal
                    title="Редактирование записи"
                    onClose={onClose}
                    footer={
                        <>
                            <Button variant="secondary" onClick={onClose} disabled={isSaving}>Отмена</Button>
                            <Button variant="primary" onClick={handleSave} loading={isSaving}>Сохранить</Button>
                        </>
                    }
                >
                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Сотрудник</label>
                            <select
                                className="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                value={employeeId || ''}
                                onChange={(e) => setEmployeeId(e.target.value)}
                            >
                                <option value="">Не выбран</option>
                                {Object.values(usersMap).map(u => (
                                    <option key={u.ID} value={u.ID}>{u.NAME} {u.LAST_NAME}</option>
                                ))}
                            </select>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Часы</label>
                                <div className="relative">
                                    <input
                                        type="number"
                                        step="0.1"
                                        className="w-full rounded-lg border-slate-300 border pl-3 pr-8 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none font-mono"
                                        value={hours}
                                        onChange={(e) => setHours(e.target.value)}
                                    />
                                    <span className="absolute right-3 top-2 text-slate-400 text-sm">ч</span>
                                </div>
                            </div>
                            <div className="flex items-end pb-2">
                                <label className="flex items-center gap-2 cursor-pointer select-none">
                                    <input
                                        type="checkbox"
                                        className="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                                        checked={isConsidered}
                                        onChange={(e) => setIsConsidered(e.target.checked)}
                                    />
                                    <span className="text-sm font-medium text-slate-700">Учитывать часы?</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">Описание / Комментарий</label>
                            <textarea
                                className="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none min-h-[100px]"
                                value={description}
                                onChange={(e) => setDescription(e.target.value)}
                                placeholder="Опишите выполненную работу..."
                            />
                        </div>
                    </div>
                </Modal>
            );
        };


        // --- ОСНОВНОЙ КОНТЕНТ ---

        const TaskRow = ({ node, level, expanded, onToggle, clientHourRate, onEditItem }) => {
            const hasChildren = node.children.length > 0 || node.items.length > 0;
            const indent = { paddingLeft: `${Math.max(0.5, level * 1.5)}rem` };

            /* Расчеты для строки */
            const totalHours = node.cumulativeConsidered + node.cumulativeUnconsidered;
            const money = node.cumulativeConsidered * clientHourRate;

            return (
                <div className="group">
                    <div
                        className={`
                            flex items-center gap-3 p-3 border-b border-slate-100 transition-colors
                            ${level === 0 ? 'bg-slate-50/50' : 'bg-white hover:bg-slate-50'}
                        `}
                        style={indent}
                    >
                        <div className="flex-1 min-w-0 flex items-center gap-2">
                            {hasChildren ? (
                                <button onClick={() => onToggle(node.taskId)} className="w-6 h-6 flex items-center justify-center rounded text-slate-400 hover:bg-slate-200 hover:text-slate-600 transition-colors">
                                    <Icon name={expanded ? "expand_more" : "chevron_right"} />
                                </button>
                            ) : <div className="w-6" />}

                            <div className="flex flex-col min-w-0">
                                <div className="flex items-center gap-2">
                                    <span className="font-semibold text-sm text-slate-800 truncate" title={node.taskTitle}>{node.taskTitle}</span>
                                    <a href={`/company/personal/user/0/tasks/task/view/${node.taskId}/`} target="_blank" className="text-slate-300 hover:text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <Icon name="open_in_new" className="text-xs" />
                                    </a>
                                </div>
                                <span className="text-[10px] text-slate-400 font-mono">ID: {node.taskId}</span>
                            </div>
                        </div>

                        {/* Колонки статистики */}
                        <div className="flex items-center gap-6 text-right shrink-0">
                            {clientHourRate > 0 && (
                                <div className="w-24 hidden md:block">
                                    <div className="text-xs text-slate-400">Сумма</div>
                                    <div className="text-sm font-semibold text-slate-700">{money.toLocaleString('ru-RU')} ₽</div>
                                </div>
                            )}

                            <div className="w-20">
                                <div className="text-xs text-emerald-600 font-medium">Учтено</div>
                                <div className="text-sm font-bold text-slate-700">{node.cumulativeConsidered.toFixed(2)} ч</div>
                            </div>

                            <div className="w-20">
                                <div className="text-xs text-rose-600 font-medium opacity-80">Не учтено</div>
                                <div className="text-sm font-medium text-slate-500">{node.cumulativeUnconsidered.toFixed(2)} ч</div>
                            </div>
                        </div>
                    </div>

                    {/* Рендер детей и айтемов если развернуто */}
                    {expanded && (
                        <div className="animate-slide-down">
                            {node.items.map(item => (
                                <ItemRow key={item.id} item={item} level={level + 1} onEdit={onEditItem} />
                            ))}
                            {node.children.map(child => (
                                <TaskRowWithState key={child.taskId} node={child} level={level + 1} clientHourRate={clientHourRate} onEditItem={onEditItem} />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const TaskRowWithState = (props) => {
            const [expanded, setExpanded] = useState(true);
            return <TaskRow {...props} expanded={expanded} onToggle={() => setExpanded(!expanded)} />;
        };

        const ItemRow = ({ item, level, onEdit }) => {
            const indent = { paddingLeft: `${(level * 1.5) + 2.5}rem` }; // +2.5rem for visual alignment under task title
            const isConsidered = item.isConsidered;

            return (
                <div className="flex items-center gap-3 p-2 border-b border-slate-50 bg-white hover:bg-blue-50/30 transition-colors group" style={indent}>
                    <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                            <div className={`w-1.5 h-1.5 rounded-full shrink-0 ${isConsidered ? 'bg-emerald-500' : 'bg-rose-400'}`}></div>
                            <span className="text-sm text-slate-700 truncate">{item.title || 'Без названия'}</span>
                        </div>
                        <div className="text-xs text-slate-400 ml-3.5 mt-0.5 flex gap-2">
                            <span>{new Date(item.createdTime).toLocaleDateString()}</span>
                            <span>•</span>
                            <span className="truncate max-w-[200px]">{item.employeeName}</span>
                        </div>
                    </div>

                    <div className="flex items-center gap-4 shrink-0">
                        <div className={`text-sm font-bold w-16 text-right ${isConsidered ? 'text-emerald-600' : 'text-slate-400'}`}>
                            {parseFloat(item.hours).toFixed(2)} ч
                        </div>
                        <button onClick={() => onEdit(item)} className="p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-100 opacity-0 group-hover:opacity-100 transition-all">
                            <Icon name="edit" className="text-lg" />
                        </button>
                    </div>
                </div>
            );
        };

        // --- ГЛАВНОЕ ПРИЛОЖЕНИЕ ---

        const App = () => {
            const { currentUser, usersMap, config, isReady, initError } = useBitrixInit();

            // --- STATE ---
            const [rootTaskId, setRootTaskId] = useState(null);
            const [taskTree, setTaskTree] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Настройки
            const [clientHourRate, setClientHourRate] = useState(3000); // Default
            const [showSettings, setShowSettings] = useState(false);

            // Модалки
            const [editingItem, setEditingItem] = useState(null);
            const [reportModalOpen, setReportModalOpen] = useState(false);
            const [isReporting, setIsReporting] = useState(false);

            // --- DATA LOADING LOGIC ---

            const loadData = useCallback(async (taskId) => {
                if (!taskId || !config) return; // Don't load if config missing
                setLoading(true);
                setError(null);

                const FIELDS = config.FIELDS;
                const SMART_PROCESS_ID = config.DEFAULT_SMART_PROCESS_ID;

                try {
                    // 1. Получаем инфу по корневой задаче
                    const rootTaskRes = await new Promise(r => BX24.callMethod('tasks.task.get', { taskId, select: ['ID', 'TITLE'] }, r));
                    if (rootTaskRes.error()) throw new Error(rootTaskRes.error().toString());
                    const rootTask = rootTaskRes.data().task;

                    // 2. Получаем все подзадачи (BFS)
                    let allTasks = [{ id: rootTask.id, title: rootTask.title, parentId: null }];
                    let queue = [rootTask.id];
                    let processed = new Set([rootTask.id]);

                    // Лимит итераций
                    let iterations = 0;
                    while (queue.length > 0 && iterations < 50) {
                        const batch = [];
                        const currentLevelIds = queue.splice(0, 50);

                        currentLevelIds.forEach(pid => {
                            batch.push(['tasks.task.list', { filter: { PARENT_ID: pid }, select: ['ID', 'TITLE', 'PARENT_ID', 'GROUP_ID'] }]);
                        });

                        if (batch.length === 0) break;

                        const results = await new Promise(r => BX24.callBatch(batch, r));

                        Object.values(results).forEach(res => {
                            if (!res.error()) {
                                const tasks = res.data().tasks || [];
                                tasks.forEach(t => {
                                    if (!processed.has(t.id)) {
                                        processed.add(t.id);
                                        allTasks.push({ id: t.id, title: t.title, parentId: t.parentId });
                                        queue.push(t.id);
                                    }
                                });
                            }
                        });
                        iterations++;
                    }

                    // 3. Получаем записи из Смарт-процесса для ВСЕХ найденных задач
                    const allTaskIds = allTasks.map(t => t.id);
                    const CHUNK_SIZE = 50;
                    let allItems = [];

                    for (let i = 0; i < allTaskIds.length; i += CHUNK_SIZE) {
                        const chunk = allTaskIds.slice(i, i + CHUNK_SIZE);
                        const batchCmds = chunk.map(tid => ['crm.item.list', {
                            entityTypeId: SMART_PROCESS_ID,
                            filter: { [FIELDS.TASK_ID]: tid },
                            select: ['id', 'createdTime', FIELDS.TASK_ID, FIELDS.EMPLOYEE, FIELDS.HOURS, FIELDS.IS_CONSIDERED, FIELDS.DESCRIPTION, 'TITLE']
                        }]);

                        const chunkResults = await new Promise(r => BX24.callBatch(batchCmds, r));
                        Object.values(chunkResults).forEach(res => {
                            if (!res.error()) allItems.push(...res.data().items);
                        });
                    }

                    // 4. Сборка дерева
                    const nodesMap = {};
                    allTasks.forEach(t => {
                        nodesMap[t.id] = {
                            taskId: t.id,
                            taskTitle: t.title,
                            parentId: t.parentId,
                            children: [],
                            items: [],
                            totalConsidered: 0,
                            totalUnconsidered: 0,
                            cumulativeConsidered: 0,
                            cumulativeUnconsidered: 0
                        };
                    });

                    allItems.forEach(item => {
                        const tid = item[FIELDS.TASK_ID];
                        if (nodesMap[tid]) {
                            const hours = parseFloat(item[FIELDS.HOURS]) || 0;
                            const isConsidered = item[FIELDS.IS_CONSIDERED] === 'Y' || item[FIELDS.IS_CONSIDERED] === true;
                            const empId = item[FIELDS.EMPLOYEE];
                            const empName = usersMap[empId] ? `${usersMap[empId].NAME} ${usersMap[empId].LAST_NAME}` : `User ${empId}`;

                            nodesMap[tid].items.push({
                                id: item.id,
                                title: item.title,
                                createdTime: item.createdTime,
                                hours: hours,
                                isConsidered: isConsidered,
                                description: item[FIELDS.DESCRIPTION] || '',
                                employeeId: empId,
                                employeeName: empName
                            });

                            if (isConsidered) nodesMap[tid].totalConsidered += hours;
                            else nodesMap[tid].totalUnconsidered += hours;
                        }
                    });

                    // Иерархия
                    const roots = [];
                    Object.values(nodesMap).forEach(node => {
                        if (node.parentId && nodesMap[node.parentId]) {
                            nodesMap[node.parentId].children.push(node);
                        } else if (String(node.taskId) === String(taskId)) {
                            roots.push(node);
                        }
                    });

                    const calculateTotals = (node) => {
                        let childCons = 0;
                        let childUncons = 0;
                        node.children.forEach(child => {
                            const res = calculateTotals(child);
                            childCons += res.cons;
                            childUncons += res.uncons;
                        });
                        node.cumulativeConsidered = node.totalConsidered + childCons;
                        node.cumulativeUnconsidered = node.totalUnconsidered + childUncons;
                        return { cons: node.cumulativeConsidered, uncons: node.cumulativeUnconsidered };
                    };

                    roots.forEach(calculateTotals);

                    setTaskTree(roots);
                    setLoading(false);

                } catch (e) {
                    console.error(e);
                    setError(e.toString());
                    setLoading(false);
                }
            }, [config, usersMap]);


            // --- EFFECTS ---

            useEffect(() => {
                if (isReady) {
                    if (initError) {
                        // Если ошибка инициализации конфига, она покажется в рендере, но загрузку не начинаем
                        setLoading(false);
                        return;
                    }

                    const params = BX24.placement.info().options || {};
                    const tid = params.taskId || params.ID || params.id;
                    if (tid) {
                        setRootTaskId(tid);
                        // Теперь loadData зависит от config, она сама вызовется когда config станет доступен?
                        // Нет, нужно вызвать если config уже есть. Или добавить config в deps.
                        // Added config to deps of loadData, so simply calling here if config exists is safe/redundant.
                        // Better rely on useEffect that watches [isReady, config, tid]
                    } else {
                        setError("Не передан ID задачи (параметры размещения пусты). Откройте приложение во вкладке задачи.");
                        setLoading(false);
                    }
                }
            }, [isReady, initError]); // Wait for Init step

            // Trigger load when everything is ready
            useEffect(() => {
                if (isReady && config && rootTaskId) {
                    loadData(rootTaskId);
                }
            }, [isReady, config, rootTaskId, loadData]);


            // --- HANDLERS ---

            const handleUpdateItem = async (data) => {
                const { id, hours, isConsidered, description, employeeId } = data;
                if (!config) return;

                const FIELDS = config.FIELDS;
                const SMART_PROCESS_ID = config.DEFAULT_SMART_PROCESS_ID;

                return new Promise((resolve) => {
                    BX24.callMethod('crm.item.update', {
                        entityTypeId: SMART_PROCESS_ID,
                        id: id,
                        fields: {
                            [FIELDS.HOURS]: hours,
                            [FIELDS.IS_CONSIDERED]: isConsidered ? 'Y' : 'N',
                            [FIELDS.DESCRIPTION]: description,
                            [FIELDS.EMPLOYEE]: employeeId
                        }
                    }, (res) => {
                        if (res.error()) {
                            alert("Ошибка сохранения: " + res.error());
                        } else {
                            loadData(rootTaskId);
                        }
                        resolve();
                    });
                });
            };

            const handleExportExcel = () => {
                // ... same logic simpler ...
                const rows = [];
                const traverse = (node, depth = 0) => {
                    const indent = "   ".repeat(depth);
                    rows.push({
                        "Тип": "Задача",
                        "Название": indent + node.taskTitle,
                        "Часы (Всего)": node.cumulativeConsidered + node.cumulativeUnconsidered,
                        "Часы (Учтено)": node.cumulativeConsidered,
                        "Сумма (Учтено)": node.cumulativeConsidered * clientHourRate
                    });
                    node.items.forEach(item => {
                        rows.push({
                            "Тип": "Запись",
                            "Название": indent + " - " + (item.title || "Без названия"),
                            "Сотрудник": item.employeeName,
                            "Дата": new Date(item.createdTime).toLocaleDateString(),
                            "Часы (Всего)": item.hours,
                            "Часы (Учтено)": item.isConsidered ? item.hours : 0,
                            "Сумма (Учтено)": item.isConsidered ? (item.hours * clientHourRate) : 0,
                            "Комментарий": item.description
                        });
                    });
                    node.children.forEach(c => traverse(c, depth + 1));
                };

                taskTree.forEach(root => traverse(root));
                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Отчет");
                XLSX.writeFile(wb, `Report_Task_${rootTaskId}.xlsx`);
            };

            const handleTransferToReport = () => {
                setIsReporting(true);
                const batch = [];

                const collect = (nodes) => {
                    nodes.forEach(node => {
                        node.items.forEach(item => {
                            if (item.isConsidered && item.hours > 0) {
                                batch.push(['task.elapseditem.add', {
                                    TASKID: node.taskId,
                                    FIELDS: {
                                        SECONDS: Math.round(item.hours * 3600),
                                        COMMENT_TEXT: item.description || `Отражение часов: ${item.title}`,
                                        USER_ID: item.employeeId
                                    }
                                }]);
                            }
                        });
                        if (node.children) collect(node.children);
                    });
                };

                collect(taskTree);

                if (batch.length === 0) {
                    alert("Нет данных для переноса (0 учтенных часов).");
                    setIsReporting(false);
                    setReportModalOpen(false);
                    return;
                }

                BX24.callBatch(batch, (res) => {
                    setIsReporting(false);
                    setReportModalOpen(false);
                    BX24.UI.Notification.Center.show({ content: "Часы успешно перенесены в стандартный отчет Битрикс24!" });
                });
            };

            // --- RENDER ---

            if (!isReady || (loading && !initError)) return (
                <div className="flex flex-col items-center justify-center h-full gap-4 text-slate-400">
                    <span className="material-symbols-outlined text-4xl animate-spin text-blue-500">progress_activity</span>
                    <p>Загрузка и инициализация...</p>
                </div>
            );

            if (initError) return (
                <div className="flex items-center justify-center h-full p-6">
                    <Card className="p-8 max-w-lg text-center border-red-200 bg-red-50">
                        <Icon name="settings" className="text-4xl text-red-500 mb-4" />
                        <h2 className="text-xl font-bold text-red-700 mb-2">Ошибка Конфигурации</h2>
                        <p className="text-red-600 mb-4">{initError}</p>
                        <p className="text-sm text-slate-500">Попробуйте переустановить приложение или обратитесь к администратору.</p>
                        <Button variant="secondary" className="mt-6 mx-auto" onClick={() => window.location.reload()}>Повторить</Button>
                    </Card>
                </div>
            );

            if (error) return (
                <div className="flex items-center justify-center h-full p-6">
                    <Card className="p-8 max-w-lg text-center border-red-200 bg-red-50">
                        <Icon name="error" className="text-4xl text-red-500 mb-4" />
                        <h2 className="text-xl font-bold text-red-700 mb-2">Ошибка загрузки данных</h2>
                        <p className="text-red-600">{error}</p>
                        <Button variant="secondary" className="mt-6 mx-auto" onClick={() => window.location.reload()}>Повторить</Button>
                    </Card>
                </div>
            );

            // Totals for header
            const totalHours = taskTree.reduce((sum, n) => sum + n.cumulativeConsidered + n.cumulativeUnconsidered, 0);
            const totalConsidered = taskTree.reduce((sum, n) => sum + n.cumulativeConsidered, 0);
            const totalMoney = totalConsidered * clientHourRate;
            const smartProcessId = config.DEFAULT_SMART_PROCESS_ID;

            return (
                <div className="flex flex-col h-full bg-slate-50">
                    {/* HEADER */}
                    <header className="bg-white border-b border-slate-200 px-6 py-4 shadow-sm z-10">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                    <Icon name="account_tree" className="text-blue-600" />
                                    Отражение часов
                                </h1>
                                <p className="text-slate-500 text-sm mt-1">Задача #{rootTaskId}</p>
                            </div>
                            <div className="flex items-center gap-3">
                                <Button variant="secondary" onClick={() => setShowSettings(!showSettings)} icon="tune">Настройки</Button>
                                <Button variant="success" onClick={handleExportExcel} icon="download">Excel</Button>
                                <Button variant="primary" onClick={() => setReportModalOpen(true)} icon="send">В отчет Битрикс</Button>
                            </div>
                        </div>

                        {showSettings && (
                            <div className="mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200 animate-slide-down">
                                <h3 className="text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">Параметры расчета</h3>
                                <div className="flex gap-6 items-end">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1">Ставка часа (Client Rate)</label>
                                        <div className="relative">
                                            <input
                                                type="number"
                                                value={clientHourRate}
                                                onChange={e => setClientHourRate(parseFloat(e.target.value) || 0)}
                                                className="pl-8 pr-3 py-2 rounded-lg border border-slate-300 w-40 focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                            <span className="absolute left-2.5 top-2 text-slate-400">₽</span>
                                        </div>
                                    </div>
                                    <div className="text-xs text-slate-400 pb-2">
                                        ID Смарт-процесса: {smartProcessId}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <StatItem label="Всего часов" value={totalHours.toFixed(2)} subtext="Сумма всех записей" icon="schedule" color="text-slate-600" />
                            <StatItem label="К оплате" value={totalConsidered.toFixed(2)} subtext="Учтенные часы" icon="check_circle" color="text-emerald-600" />
                            <StatItem label="Бюджет (Расчет)" value={`${totalMoney.toLocaleString('ru-RU')} ₽`} subtext={`По ставке ${clientHourRate} ₽/час`} icon="attach_money" color="text-blue-600" />
                        </div>
                    </header>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 overflow-y-auto p-6 custom-scrollbar">
                        <div className="max-w-6xl mx-auto space-y-4">
                            {taskTree.length > 0 ? (
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    {taskTree.map(node => (
                                        <TaskRowWithState
                                            key={node.taskId}
                                            node={node}
                                            level={0}
                                            clientHourRate={clientHourRate}
                                            onEditItem={setEditingItem}
                                        />
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-20 opacity-50">
                                    <Icon name="hourglass_empty" className="text-6xl text-slate-300 mb-4" />
                                    <p className="text-xl font-medium text-slate-500">Нет записей времени</p>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODALS */}
                    {editingItem && (
                        <EditItemModal
                            item={editingItem}
                            usersMap={usersMap}
                            onClose={() => setEditingItem(null)}
                            onSave={handleUpdateItem}
                        />
                    )}

                    {reportModalOpen && (
                        <Modal title="Подтверждение переноса" onClose={() => setReportModalOpen(false)} footer={
                            <>
                                <Button variant="secondary" onClick={() => setReportModalOpen(false)}>Отмена</Button>
                                <Button variant="primary" onClick={handleTransferToReport} loading={isReporting}>Перенести</Button>
                            </>
                        }>
                            <div className="text-center py-4">
                                <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Icon name="forward" className="text-3xl" />
                                </div>
                                <h4 className="text-lg font-bold text-slate-800 mb-2">Перенести {totalConsidered.toFixed(2)} ч. в отчет?</h4>
                                <p className="text-slate-600 mb-4">
                                    Будут созданы записи во времени задач (стандартный отчет Битрикс24) для всех элементов со статусом "Учтено".
                                </p>
                                <div className="bg-amber-50 border border-amber-200 rounded p-3 text-sm text-amber-800 text-left">
                                    <strong>Внимание:</strong> Это действие не удаляет записи из текущего приложения, а только копирует их в системный тайм-трекер задач.
                                </div>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
