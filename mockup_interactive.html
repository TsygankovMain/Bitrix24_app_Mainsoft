<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет часов - Интерактивный Мокап</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500 p-2 rounded-lg">
                <span class="material-symbols-outlined text-white text-2xl">schedule</span>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900">Учет часов</h1>
                <p class="text-xs text-slate-500">Учет трудозатрат по иерархии задач</p>
            </div>
        </div>

        <div class="flex items-center gap-4 bg-slate-50 border border-slate-200 rounded-lg p-3">
            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Стоимость часа
                    (руб.)</label>
                <input type="number" id="clientHourRate" value="3000"
                    class="bg-transparent font-bold text-slate-900 focus:outline-none w-24 mt-1">
            </div>
            <div class="h-8 w-px bg-slate-300"></div>
            <div class="flex flex-col text-right">
                <span class="text-[10px] uppercase font-bold text-blue-600 tracking-wider">Сумма для клиента</span>
                <span id="totalClientAmount" class="font-bold text-lg text-slate-900 mt-1">24,000.00 руб.</span>
            </div>
        </div>

        <div class="flex gap-2">
            <button onclick="addNewRecord()"
                class="px-4 py-2 bg-green-500 text-white font-semibold rounded-lg hover:bg-green-600 flex items-center gap-2 text-sm">
                <span class="material-symbols-outlined">add</span>
                <span>Отразить</span>
            </button>
        </div>
    </header>

    <!-- MAIN SPLIT -->
    <div class="flex-1 flex overflow-hidden">

        <!-- LEFT: TASK TREE (70%) -->
        <div class="w-[70%] flex flex-col bg-white">
            <div class="flex-1 overflow-y-auto p-4" id="taskTreeContainer">
                <!-- Task groups will be rendered here -->
            </div>
        </div>

        <!-- RIGHT: EDITOR (30%) -->
        <div class="w-[30%] flex flex-col bg-slate-50 border-l border-slate-200">
            <div class="px-5 py-4 bg-white border-b border-slate-200 flex items-center justify-between">
                <h2 class="font-bold text-slate-800">Редактирование</h2>
                <button onclick="closeEditor()"
                    class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div id="editorContent" class="flex-1 overflow-y-auto p-5">
                <div class="text-center text-slate-400 py-20">
                    <span class="material-symbols-outlined text-5xl mb-2">touch_app</span>
                    <p class="text-sm">Выберите запись для редактирования</p>
                </div>
            </div>

            <div id="editorActions" class="hidden p-5 bg-white border-t border-slate-200 flex justify-end gap-3">
                <button onclick="closeEditor()"
                    class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Отмена</button>
                <button onclick="saveCurrentItem()"
                    class="px-6 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // DATA
        const taskTree = [
            {
                taskId: 1045,
                taskTitle: 'Разработка API модуля',
                children: [
                    {
                        taskId: 1046,
                        taskTitle: 'Backend разработка',
                        children: [],
                        items: [
                            { id: 1, desc: 'Проектирование БД', employee: 'Иван Иванов', date: '2026-02-06', hours: 4.0, considered: true },
                            { id: 2, desc: 'Написание миграций', employee: 'Петр Петров', date: '2026-02-07', hours: 2.5, considered: true }
                        ]
                    },
                    {
                        taskId: 1047,
                        taskTitle: 'Frontend интеграция',
                        children: [],
                        items: [
                            { id: 3, desc: 'Разработка компонента списка', employee: 'Сидор Сидоров', date: '2026-02-05', hours: 3.0, considered: true },
                            { id: 4, desc: 'Тестирование UI', employee: 'Иван Иванов', date: '2026-02-07', hours: 1.5, considered: false }
                        ]
                    }
                ],
                items: [
                    { id: 5, desc: 'Планирование архитектуры', employee: 'Иван Иванов', date: '2026-02-04', hours: 2.0, considered: true }
                ]
            }
        ];

        let expandedTasks = new Set([1045, 1046, 1047]);
        let currentEditingId = null;
        let nextId = 6;

        // RENDERING
        function renderTaskTree() {
            const container = document.getElementById('taskTreeContainer');
            container.innerHTML = '<div class="space-y-4">' + taskTree.map(task => renderTaskGroup(task, 0)).join('') + '</div>';
            updateTotals();
        }

        function renderTaskGroup(task, level) {
            const isExpanded = expandedTasks.has(task.taskId);
            const allItems = getAllItemsRecursive(task);
            const totalConsidered = allItems.filter(i => i.considered).reduce((sum, i) => sum + i.hours, 0);
            const totalUnconsidered = allItems.filter(i => !i.considered).reduce((sum, i) => sum + i.hours, 0);
            const clientRate = parseFloat(document.getElementById('clientHourRate')?.value || 0);
            const clientSum = totalConsidered * clientRate;

            const indent = level > 0 ? `margin-left: ${level}rem;` : '';

            let html = `
                <div style="${indent}">
                    <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
                        <div class="w-full text-left p-3 bg-slate-50 border-b flex justify-between items-center cursor-pointer hover:bg-slate-100" onclick="toggleTask(${task.taskId})">
                            <div class="flex-1 min-w-0">
                                <h3 class="text-sm font-bold text-slate-900 truncate">
                                    ${level > 0 ? '<span class="font-normal text-purple-600">[Подзадача]</span> ' : ''}
                                    ${task.taskTitle}
                                </h3>
                                <p class="text-xs text-slate-600 mt-1">ID: ${task.taskId}</p>
                            </div>
                            <div class="flex items-center gap-4 ml-4 text-right shrink-0">
                                ${clientRate > 0 ? `
                                    <div class="border-r pr-4 border-slate-200">
                                        <p class="text-xs text-blue-600">Сумма для клиента</p>
                                        <p class="text-sm font-bold text-slate-800">${clientSum.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} руб.</p>
                                    </div>
                                ` : ''}
                                <div>
                                    <p class="text-xs text-green-600">Учтено (всего)</p>
                                    <p class="text-sm font-bold text-slate-800">${totalConsidered.toFixed(2)} ч</p>
                                </div>
                                <div>
                                    <p class="text-xs text-red-600">Не учтено (всего)</p>
                                    <p class="text-sm font-bold text-slate-800">${totalUnconsidered.toFixed(2)} ч</p>
                                </div>
                                <div class="flex flex-col items-center gap-1">
                                    <button onclick="event.stopPropagation(); addItemToTask(${task.taskId})" title="Отразить часы" class="p-1 rounded-full bg-green-100 text-green-700 hover:bg-green-200">
                                        <span class="material-symbols-outlined text-base">add</span>
                                    </button>
                                    <button onclick="event.stopPropagation(); toggleTask(${task.taskId})" title="Развернуть/Свернуть" class="p-1 rounded-full hover:bg-slate-200">
                                        <span class="material-symbols-outlined text-slate-500 transition-transform ${isExpanded ? 'rotate-180' : ''}">expand_more</span>
                                    </button>
                                </div>
                            </div>
                        </div>
            `;

            if (isExpanded) {
                html += '<div>';

                // Items
                task.items.forEach(item => {
                    html += renderItem(item);
                });

                // Children
                if (task.children.length > 0) {
                    html += '<div class="p-2 space-y-2 bg-slate-50 border-t">';
                    task.children.forEach(child => {
                        html += renderTaskGroup(child, level + 1);
                    });
                    html += '</div>';
                }

                html += '</div>';
            }

            html += '</div></div>';
            return html;
        }

        function renderItem(item) {
            const isActive = currentEditingId === item.id;
            return `
                <div onclick="selectItem(${item.id})" class="p-3 border-t transition-colors cursor-pointer hover:bg-blue-50 ${isActive ? 'bg-blue-50 border-l-4 border-blue-500' : ''}">
                    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-2">
                        <div class="flex-1 min-w-0">
                            <p class="font-semibold text-slate-800 truncate">${item.desc}</p>
                            <div class="flex items-center text-xs text-slate-500 mt-2 gap-3">
                                <div class="flex items-center">
                                    <span class="material-symbols-outlined text-sm mr-1">person</span>${item.employee}
                                </div>
                                <div class="flex items-center">
                                    <span class="material-symbols-outlined text-sm mr-1">calendar_today</span>${new Date(item.date).toLocaleDateString('ru-RU')}
                                </div>
                            </div>
                        </div>
                        <div class="flex md:flex-col items-center md:items-end justify-between mt-2 md:mt-0 gap-2">
                            <div class="flex items-center gap-2 text-sm font-bold">
                                <span class="${item.considered ? 'text-green-600' : 'text-red-600'}" title="${item.considered ? 'Учитываемые' : 'Не учитываемые'}">
                                    ${item.hours.toFixed(2)}ч
                                </span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="event.stopPropagation(); selectItem(${item.id})" class="px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800 hover:bg-blue-200">
                                    <span class="material-symbols-outlined text-sm">edit</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getAllItemsRecursive(task) {
            let items = [...task.items];
            task.children.forEach(child => {
                items = items.concat(getAllItemsRecursive(child));
            });
            return items;
        }

        function findItemById(id, tasks = taskTree) {
            for (let task of tasks) {
                const item = task.items.find(i => i.id === id);
                if (item) return item;
                const childItem = findItemById(id, task.children);
                if (childItem) return childItem;
            }
            return null;
        }

        function toggleTask(taskId) {
            if (expandedTasks.has(taskId)) {
                expandedTasks.delete(taskId);
            } else {
                expandedTasks.add(taskId);
            }
            renderTaskTree();
        }

        function selectItem(id) {
            currentEditingId = id;
            const item = findItemById(id);
            if (!item) return;

            document.getElementById('editorContent').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Описание</label>
                        <textarea id="editDesc" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none resize-none">${item.desc}</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Сотрудник</label>
                        <select id="editEmployee" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-white">
                            <option ${item.employee === 'Иван Иванов' ? 'selected' : ''}>Иван Иванов</option>
                            <option ${item.employee === 'Петр Петров' ? 'selected' : ''}>Петр Петров</option>
                            <option ${item.employee === 'Сидор Сидоров' ? 'selected' : ''}>Сидор Сидоров</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Дата</label>
                            <input type="date" id="editDate" value="${item.date}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Часы</label>
                            <input type="number" id="editHours" value="${item.hours}" step="0.5" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none font-bold">
                        </div>
                    </div>
                    <div>
                        <label class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg bg-white cursor-pointer hover:border-slate-300">
                            <input type="checkbox" id="editConsidered" ${item.considered ? 'checked' : ''} class="w-4 h-4 accent-blue-600">
                            <span class="text-sm font-medium">Учитывать?</span>
                        </label>
                    </div>

                    <hr class="border-slate-200 my-6">

                    <div class="p-4 bg-purple-50 border border-purple-200 rounded-lg">
                        <h3 class="flex items-center gap-2 font-bold text-purple-900 mb-3 text-sm">
                            <span class="material-symbols-outlined">call_split</span>
                            Разделить запись
                        </h3>
                        <p class="text-xs text-slate-600 mb-3">Отделить часть времени в новую запись</p>
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <input type="number" id="splitHours" step="0.5" placeholder="0" class="px-2 py-1.5 border border-purple-300 rounded text-center font-bold text-sm">
                            <span class="text-xs text-slate-600 flex items-center">часов отделить</span>
                        </div>
                        <label class="flex items-center gap-2 mb-3 text-xs cursor-pointer">
                            <input type="checkbox" id="splitInvert" class="w-3 h-3 accent-purple-600">
                            <span>Инвертировать "Учитывать?"</span>
                        </label>
                        <button onclick="splitItem()" class="w-full py-2 bg-white border border-purple-300 text-purple-700 font-medium rounded-lg hover:bg-purple-100 text-sm">Выполнить разделение</button>
                    </div>

                    <button onclick="deleteItem(${item.id})" class="w-full py-2 bg-red-50 border border-red-200 text-red-700 font-medium rounded-lg hover:bg-red-100 text-sm flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-base">delete</span>
                        Удалить запись
                    </button>
                </div>
            `;
            document.getElementById('editorActions').classList.remove('hidden');
            renderTaskTree();
        }

        function saveCurrentItem() {
            const item = findItemById(currentEditingId);
            if (!item) return;

            item.desc = document.getElementById('editDesc').value;
            item.employee = document.getElementById('editEmployee').value;
            item.date = document.getElementById('editDate').value;
            item.hours = parseFloat(document.getElementById('editHours').value) || 0;
            item.considered = document.getElementById('editConsidered').checked;

            renderTaskTree();
            alert('✅ Изменения сохранены!');
        }

        function splitItem() {
            const item = findItemById(currentEditingId);
            if (!item) return;

            const splitHours = parseFloat(document.getElementById('splitHours').value) || 0;
            const invertConsidered = document.getElementById('splitInvert')?.checked || false;

            if (splitHours <= 0 || splitHours >= item.hours) {
                alert('⚠️ Некорректное значение для разделения');
                return;
            }

            item.hours -= splitHours;

            // Find parent task and add new item
            for (let task of taskTree) {
                const findAndAddToTask = (t) => {
                    if (t.items.find(i => i.id === currentEditingId)) {
                        t.items.push({
                            id: nextId++,
                            desc: item.desc + ' (разделено)',
                            employee: item.employee,
                            date: item.date,
                            hours: splitHours,
                            considered: invertConsidered ? !item.considered : item.considered
                        });
                        return true;
                    }
                    for (let child of t.children) {
                        if (findAndAddToTask(child)) return true;
                    }
                    return false;
                };
                if (findAndAddToTask(task)) break;
            }

            selectItem(currentEditingId);
            renderTaskTree();
            alert('✅ Запись разделена!');
        }

        function deleteItem(id) {
            if (!confirm('❌ Удалить запись?')) return;

            const removeFromTask = (task) => {
                task.items = task.items.filter(i => i.id !== id);
                task.children.forEach(removeFromTask);
            };
            taskTree.forEach(removeFromTask);

            closeEditor();
            renderTaskTree();
        }

        function addItemToTask(taskId) {
            alert(`ℹ️ Добавление записи для задачи #${taskId}`);
        }

        function addNewRecord() {
            alert('ℹ️ Добавить новую запись');
        }

        function closeEditor() {
            currentEditingId = null;
            document.getElementById('editorContent').innerHTML = `
                <div class="text-center text-slate-400 py-20">
                    <span class="material-symbols-outlined text-5xl mb-2">touch_app</span>
                    <p class="text-sm">Выберите запись для редактирования</p>
                </div>
            `;
            document.getElementById('editorActions').classList.add('hidden');
            renderTaskTree();
        }

        function updateTotals() {
            const rate = parseFloat(document.getElementById('clientHourRate').value) || 0;
            let totalConsidered = 0;

            taskTree.forEach(task => {
                totalConsidered += getAllItemsRecursive(task).filter(i => i.considered).reduce((sum, i) => sum + i.hours, 0);
            });

            const totalAmount = totalConsidered * rate;
            document.getElementById('totalClientAmount').textContent = totalAmount.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' руб.';
        }

        document.getElementById('clientHourRate').addEventListener('input', () => {
            renderTaskTree();
        });

        // Initial render
        renderTaskTree();
    </script>

</body>

</html>
